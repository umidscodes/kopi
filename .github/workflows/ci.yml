name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check (gofmt, vet, build, test, race) - Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check.ps1
      - name: Check (gofmt, vet, build, test, race) - macOS
        if: runner.os == 'macOS'
        run: sh scripts/check.sh
      - name: Build Windows test app
        if: github.ref == 'refs/heads/codex/screenshot-sync' && runner.os == 'Windows'
        run: ./scripts/build-windows.ps1 -Version "screenshot-$($env:GITHUB_SHA.Substring(0,7))"
      - name: Upload Windows executable
        if: github.ref == 'refs/heads/codex/screenshot-sync' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kopi-windows-amd64
          path: bin/kopi.exe
          if-no-files-found: error
      - name: Build and verify macOS test app
        if: github.ref == 'refs/heads/codex/screenshot-sync' && runner.os == 'macOS'
        run: |
          sh scripts/build-mac-app.sh "0.1.${GITHUB_RUN_NUMBER}"
          codesign --verify --deep --strict bin/Kopi.app
          lipo -verify_arch arm64 bin/Kopi.app/Contents/MacOS/kopi
          ditto -c -k --keepParent bin/Kopi.app bin/Kopi-macOS.zip
          KOPI_CLIPBOARD_TEST=1 go test ./internal/clip -run '^TestIMG1_NativeClipboard$' -v
      - name: Upload macOS app bundle
        if: github.ref == 'refs/heads/codex/screenshot-sync' && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: kopi-macos-arm64
          path: bin/Kopi-macOS.zip
          if-no-files-found: error
