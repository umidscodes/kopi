# Cuts a GitHub release with Windows + macOS artifacts.
# To release: git tag v0.1.0 && git push origin v0.1.0
# A hyphen in the tag (e.g. v0.1.0-rc1) marks the release as a prerelease.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Version "$env:TAG"
      - name: Zip
        shell: pwsh
        # -Path on a single file puts kopi.exe at the archive root (no bin\ prefix).
        run: Compress-Archive -Path bin/kopi.exe -DestinationPath "kopi-$env:TAG-windows-amd64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: kopi-*-windows-amd64.zip

  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: sh scripts/build-mac-app.sh "$TAG"
      - name: Zip
        shell: bash
        # ditto preserves the bundle structure and ad-hoc code signature; zip can break it.
        run: ditto -c -k --keepParent bin/Kopi.app "kopi-$TAG-macos-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: kopi-*-macos-arm64.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          # No pattern: this run uploads exactly two artifacts (windows, macos).
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Create release
        shell: bash
        run: |
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --repo "${{ github.repository }}" --title "Kopi $TAG" \
            --generate-notes "${args[@]}"
